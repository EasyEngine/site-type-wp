# Behat suite of an EasyEngine package, run inside a fresh core checkout on a throwaway runner.
name: Behat

on:
  pull_request:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: behat-${{ github.ref }}
  cancel-in-progress: true

env:
  CORE_REF: develop
  COMPOSE_VERSION: v5.5.1
  # Not RCLONE_*: rclone reads those variables as its own flags.
  RCLONE_RELEASE: v1.75.1
  # No public DNS (Let's Encrypt) or real backup storage on hosted runners.
  EXCLUDE_TAGS: '~@le&&~@remote-real'
  # Local rclone alias written to EE's rclone-path; empty = no rclone.
  EE_RCLONE_PATH: ''
  COMPOSE_INTERACTIVE_NO_CLI: 1
  RCLONE_CONFIG: /etc/rclone/rclone.conf
  EE_BEHAT_DESTRUCTIVE: 1

jobs:
  behat:
    name: Behat ${{ matrix.lane }} (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 150
    # Known bugs are expected to fail; they're reported, not gating.
    continue-on-error: ${{ matrix.lane == 'known-bug' }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']
        lane: [main, slow, known-bug]
        include:
          - lane: main
            tags: '~@known-bug&&~@slow'
          - lane: slow
            tags: '@slow&&~@known-bug'
          - lane: known-bug
            tags: '@known-bug'
    steps:
      - name: Check out the package
        uses: actions/checkout@v7
        with:
          path: pkg

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer
          extensions: pcntl, curl, sqlite3, zip, dom, mbstring, json

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config -g cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Set up Composer caching
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-php${{ matrix.php }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-composer-php${{ matrix.php }}-

      - name: Prepare the host
        run: |
          # The runner image ships web and database servers; EE needs 80/443.
          sudo systemctl stop nginx apache2 mysql 2>/dev/null || true
          sudo ss -ltnp | grep -E ':(80|443|3306) ' || true
          sudo curl -fsSL "https://github.com/docker/compose/releases/download/${COMPOSE_VERSION}/docker-compose-linux-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker version --format 'docker {{.Server.Version}}'
          docker-compose version
          openssl version
          echo "umask $(umask), under sudo $(sudo sh -c umask)"
          if [ -n "$EE_RCLONE_PATH" ]; then
            curl -fsSL "https://github.com/rclone/rclone/releases/download/${RCLONE_RELEASE}/rclone-${RCLONE_RELEASE}-linux-amd64.zip" -o "$RUNNER_TEMP/rclone.zip"
            unzip -q -j -o "$RUNNER_TEMP/rclone.zip" '*/rclone' -d "$RUNNER_TEMP"
            sudo install -m 0755 "$RUNNER_TEMP/rclone" /usr/local/bin/rclone
            sudo mkdir -p "$(dirname "$RCLONE_CONFIG")" /var/tmp/ee-rclone
            printf '[%s]\ntype = alias\nremote = /var/tmp/ee-rclone\n' "${EE_RCLONE_PATH%%:*}" | sudo tee "$RCLONE_CONFIG" >/dev/null
            sudo -E rclone listremotes
          fi

      - name: Set up EasyEngine core
        run: |
          git clone -q --depth 1 -b "$CORE_REF" https://github.com/EasyEngine/easyengine.git easyengine
          cd easyengine
          # All easyengine/* packages on dev-develop (as core CI does), except the one under test: that's this checkout.
          php -r '
            $pkg = json_decode(file_get_contents("../pkg/composer.json"), true)["name"];
            $j = json_decode(file_get_contents("composer.json"), true);
            foreach ($j["require"] as $k => $v) if (strpos($k, "easyengine/") === 0) $j["require"][$k] = "dev-develop";
            $repos = isset($j["repositories"]) ? $j["repositories"] : [];
            array_unshift($repos, ["type" => "path", "url" => "../pkg", "options" => ["symlink" => false, "versions" => [$pkg => "dev-develop"]]]);
            $j["repositories"] = $repos;
            file_put_contents("composer.json", json_encode($j, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES) . "\n");
            file_put_contents(getenv("GITHUB_ENV"), "PKG=$pkg\n", FILE_APPEND);'
          composer update --prefer-dist --no-progress --no-interaction
          composer show "$(jq -r .name ../pkg/composer.json)" | grep -E '^(versions|source|dist) ' || true
          rm -rf features
          cp -R ../pkg/features features
          # Some commands (clone, sync) shell out to `ee` from PATH.
          sudo ln -sf "$PWD/bin/ee" /usr/local/bin/ee

      - name: Initialise EasyEngine
        working-directory: easyengine
        run: |
          sudo -E bin/ee cli info
          # The first non-cli command runs the initial setup (DB, config, image pulls).
          sudo -E bin/ee site list || true
          # Non-LE commands such as ssl-renew still prompt for le-mail when it's missing.
          sudo -E bin/ee config set le-mail behat@example.com
          if [ -n "$EE_RCLONE_PATH" ]; then
            sudo -E bin/ee config set rclone-path "$EE_RCLONE_PATH"
            sudo -E bin/ee config set no-of-backups 3
          fi

      - name: Run Behat
        working-directory: easyengine
        # A hung step (e.g. a command stopped on the TTY) should still leave logs.
        timeout-minutes: 75
        shell: 'script -q -e -c "bash {0}"'
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/behat/junit"
          sudo -E vendor/bin/behat --strict --tags="${EXCLUDE_TAGS}&&${{ matrix.tags }}" \
            --format=progress --out=std \
            --format=junit --out="$RUNNER_TEMP/behat/junit" \
            --format=pretty --out="$RUNNER_TEMP/behat/pretty.log"

      - name: Collect logs
        if: always()
        run: |
          out="$RUNNER_TEMP/behat"
          mkdir -p "$out"
          sudo cp /opt/easyengine/logs/ee.log "$out/" 2>/dev/null || echo 'No ee.log.'
          sudo stat -c '%a %U:%G %n' /opt/easyengine /opt/easyengine/logs > "$out/dirs.txt" 2>/dev/null || true
          sudo docker ps -a --format '{{.Names}}\t{{.Image}}\t{{.Status}}' > "$out/containers.txt" || true
          sudo chown -R "$USER" "$out"
          # One block per failed scenario, from the junit files.
          python3 - "$out" <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          out = sys.argv[1]
          lines = []
          for f in sorted(glob.glob(out + '/junit/*.xml')):
              for case in ET.parse(f).getroot().iter('testcase'):
                  for bad in list(case.findall('failure')) + list(case.findall('error')):
                      lines.append('### %s :: %s\n%s\n%s\n' % (case.get('classname'), case.get('name'), bad.get('message') or '', bad.text or ''))
          open(out + '/failures.txt', 'w').write('\n'.join(lines) or 'No failures.\n')
          print('%d failed scenarios' % len(lines))
          PY
          head -c 20000 "$out/failures.txt"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: behat-${{ matrix.lane }}-php${{ matrix.php }}
          path: ${{ runner.temp }}/behat
          retention-days: 14
