# @le Behat scenarios against Pebble: EE's hardcoded Let's Encrypt host is redirected to it on the runner (test-only).
name: Behat LE (Pebble)

on:
  pull_request:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: behat-le-${{ github.ref }}
  cancel-in-progress: true

env:
  CORE_REF: develop
  COMPOSE_VERSION: v5.5.1
  COMPOSE_INTERACTIVE_NO_CLI: 1
  EE_BEHAT_DESTRUCTIVE: 1
  # Scenarios that need the public LE service itself are tagged @le-real and never run here.
  LE_TAGS: '@le&&~@le-real'

jobs:
  behat-le:
    name: Behat LE ${{ matrix.lane }} (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: ${{ matrix.lane == 'known-bug' }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']
        lane: [main, known-bug]
        include:
          - lane: main
            tags: '~@known-bug'
          # The whole feature: some known-bug scenarios check what an earlier scenario left behind.
          - lane: known-bug
            tags: '@le'
    steps:
      - name: Check out the package
        uses: actions/checkout@v7
        with:
          path: pkg

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer
          extensions: pcntl, curl, sqlite3, zip, dom, mbstring, json

      - name: Prepare the host
        run: |
          sudo systemctl stop nginx apache2 mysql 2>/dev/null || true
          sudo curl -fsSL "https://github.com/docker/compose/releases/download/${COMPOSE_VERSION}/docker-compose-linux-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker version --format 'docker {{.Server.Version}}'

      - name: Set up EasyEngine core
        run: |
          git clone -q --depth 1 -b "$CORE_REF" https://github.com/EasyEngine/easyengine.git easyengine
          cd easyengine
          php -r '
            $pkg = json_decode(file_get_contents("../pkg/composer.json"), true)["name"];
            $j = json_decode(file_get_contents("composer.json"), true);
            foreach ($j["require"] as $k => $v) if (strpos($k, "easyengine/") === 0) $j["require"][$k] = "dev-develop";
            $repos = isset($j["repositories"]) ? $j["repositories"] : [];
            array_unshift($repos, ["type" => "path", "url" => "../pkg", "options" => ["symlink" => false, "versions" => [$pkg => "dev-develop"]]]);
            $j["repositories"] = $repos;
            file_put_contents("composer.json", json_encode($j, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES) . "\n");'
          composer update --prefer-dist --no-progress --no-interaction
          rm -rf features
          cp -R ../pkg/features features
          sudo ln -sf "$PWD/bin/ee" /usr/local/bin/ee

      - name: Initialise EasyEngine
        working-directory: easyengine
        run: |
          sudo -E bin/ee cli info
          sudo -E bin/ee site list || true
          sudo -E bin/ee config set le-mail behat-ci@example.org

      - name: Start Pebble and redirect Let's Encrypt to it
        run: |
          sudo -E pkg/.github/behat/pebble-setup.sh setup
          # Diagnostic only: nginx-proxy may not be up before the first site exists.
          sudo docker ps --format '{{.Names}} {{.Ports}}'
          sudo pkg/.github/behat/pebble-setup.sh reach || true

      - name: Run Behat (@le)
        working-directory: easyengine
        shell: 'script -q -e -c "bash {0}"'
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/behat/junit"
          sudo -E vendor/bin/behat --strict --tags="${LE_TAGS}&&${{ matrix.tags }}" \
            --format=progress --out=std \
            --format=junit --out="$RUNNER_TEMP/behat/junit" \
            --format=pretty --out="$RUNNER_TEMP/behat/pretty.log"

      - name: Collect logs
        if: always()
        run: |
          out="$RUNNER_TEMP/behat"
          mkdir -p "$out"
          sudo cp /opt/easyengine/logs/ee.log "$out/" 2>/dev/null || echo 'No ee.log.'
          sudo pkg/.github/behat/pebble-setup.sh logs > "$out/pebble.log" 2>&1 || true
          sudo docker ps -a --format '{{.Names}}\t{{.Image}}\t{{.Status}}' > "$out/containers.txt" || true
          sudo chown -R "$USER" "$out"
          tail -n 60 "$out/pebble.log" || true

      - name: Tear down Pebble
        if: always()
        run: sudo pkg/.github/behat/pebble-setup.sh teardown

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: behat-le-${{ matrix.lane }}-php${{ matrix.php }}
          path: ${{ runner.temp }}/behat
          retention-days: 14
